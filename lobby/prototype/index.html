<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>大厅原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#17263A;--cyan:#2FD3E0;--gold:#FFD45C;--F:"Noto Sans SC","PingFang SC",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a121d;overflow:hidden;font-family:var(--F)}
/* fixed：1080 宽的画布不撑大手机的布局视口（否则手机浏览器会缩小整页、fit 算错） */
#wrap{position:fixed;left:0;top:0;width:1080px;height:2340px;transform-origin:top left}
#canvas{position:relative;width:1080px;height:2340px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;background:#0d1724}
/* 图片和字体都到齐后整屏一起显示，避免元素先后蹦出来 */
#canvas.boot>*{visibility:hidden}
#canvas.boot::after{content:"加载中…";position:absolute;left:0;right:0;top:1150px;text-align:center;color:#8c96a3;font:500 36px sans-serif;visibility:visible}
#canvas.reveal>#scene{animation:sceneIn .22s ease-out}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
.sp{position:absolute;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
.ti{position:absolute;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.t{position:absolute;white-space:nowrap;line-height:1;font-weight:700;pointer-events:none}
.t.mm{transform:translate(-50%,-50%)} .t.lm{transform:translateY(-50%)}
.hit{position:absolute;cursor:pointer}
/* 按压组：一个按钮的底图、图标、文字放在同一组里，按下时整组一起动 */
.pg{position:absolute;left:0;top:0;width:1080px;height:2340px;pointer-events:none;transition:transform .08s ease-out,filter .08s}
.pg.press{transform:scale(.96);filter:brightness(.9)}
#battleGrp.press{transform:translate(4px,10px);filter:brightness(.92)}
.title{font-weight:900;font-style:italic;text-shadow:0 4px 0 #0b1420,0 6px 16px #000c;letter-spacing:2px}
.skin{border-style:solid;border-color:transparent}
.b-yel{border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_Yellow.png) 30 fill/30px stretch}
.b-wht{border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_White.png) 30 fill/30px stretch}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;color:var(--ink)}
.btn:active{filter:brightness(.92);transform:scale(.97)}
.mask{position:absolute;inset:0;background:#000a;z-index:40;display:none}
.mask.on{display:block}
.mframe{position:absolute;border-style:solid;border-color:transparent;border-width:160px 40px 200px 40px;border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Modal_Tactic.png) 160 40 200 40 fill stretch;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.lbl{position:absolute;white-space:nowrap;line-height:1}
.seg{position:absolute;display:flex;border:3px solid #6f8197;border-radius:8px;overflow:hidden;background:#0f1a28}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;color:#c9d3dd;font-weight:700;cursor:pointer}
.seg div+div{border-left:2px solid #6f8197}
.seg div.on{background:#2b6fd6;color:#fff}
.sw{position:absolute;width:120px;height:52px;border-radius:8px;background:#d9d4c8;border:3px solid #8f8a80;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:52px;height:38px;border-radius:5px;background:#8c96a3;transition:left .15s,background .15s}
.sw.on::after{left:58px;background:#2b6fd6}
.sw span{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;color:#4a5566}
#toast{position:absolute;left:50%;top:1900px;transform:translateX(-50%);background:#111e2bee;color:#fff;border:2px solid var(--cyan);padding:20px 36px;border-radius:8px;font-size:32px;font-weight:700;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* L03 VS：厚装甲版（handoff/vs-armor-r01） */
#vs{position:absolute;inset:0;z-index:50;display:none;overflow:hidden;background:#0d1724;transition:opacity .18s}
#vs.on{display:block} #vs.out{opacity:0}
#vs .g{position:absolute;left:0;top:0;width:1080px;height:2340px;pointer-events:none}
#vs.anim .g-opp{animation:vsInL .34s cubic-bezier(.2,.7,.3,1) both}
#vs.anim .g-me{animation:vsInR .34s .08s cubic-bezier(.2,.7,.3,1) both}
#vs.anim .g-v{animation:vsV .24s .25s cubic-bezier(.6,0,.9,.5) both}
#vs.anim .g-s{animation:vsS .24s .25s cubic-bezier(.6,0,.9,.5) both}
#vs.anim .g-vs{transform-origin:540px 1000px;animation:vsShake .12s .49s linear}
#vs.anim .g-flash{opacity:0;animation:vsFlash .16s .49s ease-out}
#vs.anim .g-spark{opacity:0;animation:vsSpark .3s .49s ease-out}
#vs.anim .g-deck{animation:vsUp .3s .55s cubic-bezier(.2,.7,.3,1) both;--up:24px}
#vs.anim .g-card{animation:vsUp .22s cubic-bezier(.2,.7,.3,1) both;--up:16px}
#vs.anim .g-load{animation:vsFade .25s .6s both}
#vs.reduce *{animation:none!important}
@keyframes vsInL{from{transform:translateX(-180px);opacity:0}to{transform:none;opacity:1}}
@keyframes vsInR{from{transform:translateX(180px);opacity:0}to{transform:none;opacity:1}}
@keyframes vsV{from{transform:translateX(-360px) scale(1.15);opacity:0;transform-origin:540px 1000px}to{transform:none;opacity:1;transform-origin:540px 1000px}}
@keyframes vsS{from{transform:translateX(360px) scale(1.15);opacity:0;transform-origin:540px 1000px}to{transform:none;opacity:1;transform-origin:540px 1000px}}
@keyframes vsShake{0%{transform:translate(4px,-3px)}33%{transform:translate(-3px,2px)}66%{transform:translate(2px,-1px)}100%{transform:none}}
@keyframes vsFlash{from{opacity:1}to{opacity:0}}
@keyframes vsSpark{from{opacity:1;transform:none}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes vsUp{from{transform:translateY(var(--up));opacity:0}to{transform:none;opacity:1}}
@keyframes vsFade{from{opacity:0}to{opacity:1}}
/* L06 */
.bar{position:absolute;left:90px;top:2050px;width:900px;height:44px;border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_White.png) 22 fill/22px stretch;border-style:solid;border-color:transparent}
.bar i{position:absolute;left:4px;top:6px;bottom:6px;width:0;background:linear-gradient(90deg,#18b8c6,#5ff0fa);border-radius:3px}
#splash{position:absolute;inset:0;z-index:90;background:#13202f;display:none;cursor:pointer}
#splash.on{display:block} #splash{transition:opacity .2s} #splash.out{opacity:0}
#splash .band{position:absolute;left:-200px;width:1500px;height:150px;background:#c9c6bd;transform:rotate(-14deg);box-shadow:inset 0 -8px 0 #8f8a80}
</style>
</head>
<body>
<div id="wrap"><div id="canvas" class="boot">
  <div id="scene"></div>
  <div id="vs"></div>
  <div class="mask" id="mask"></div>
  <div id="pop" style="position:absolute;inset:0;z-index:41;pointer-events:none"></div>
  <div id="splash"></div>
  <div id="toast"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const SL='../handoff/asym-r01/slices/UI_FDLobby_';
const DECK_URL='../../deck/prototype/';
// 卡牌数据（与选卡组原型一致的子集）
const CARDS={
 missile:{name:"飞弹齐射",cost:2,role:"战术",art:"missile"}, char:{name:"夏亚渣古",cost:3,role:"突击",art:"red"},
 drop:{name:"渣古降下",cost:3,role:"小队",art:"green"}, gundam:{name:"高达",cost:4,role:"盾卫",art:"blue"},
 freedom:{name:"自由",cost:4,role:"清群",art:"noart"}, mega:{name:"米加粒子炮击",cost:4,role:"战术",art:"beam"},
 exia:{name:"能天使",cost:5,role:"刺客",art:"purple"}, x:{name:"高达X",cost:6,role:"攻城",art:"orange"},
 guncannon:{name:"钢加农",cost:4,role:"射手",art:"red"}, dynames:{name:"力天使",cost:3,role:"狙击",art:"blue"},
 psycho:{name:"精神力",cost:7,role:"盾卫",art:"noart"}, maganac:{name:"马格亚那克",cost:3,role:"小队",art:"green"},
 flag:{name:"旗帜式小队",cost:2,role:"小队",art:"noart"}, geara:{name:"基拉·多加",cost:3,role:"射手",art:"noart"}
};
const PRESETS=[
 {name:"原版",cards:["missile","char","drop","gundam","freedom","mega","exia","x"]},
 {name:"远程",cards:["missile","dynames","drop","gundam","freedom","guncannon","mega","x"]},
 {name:"诱饵套",cards:["flag","char","drop","maganac","geara","dynames","gundam","psycho"]}
];
const TIPS=["自由的全弹发射能同时瘫痪 5 台机体","飞弹齐射能打断高达X 的卫星炮蓄力","渣古降下可以扔到全场任何地方","能天使血量低于一半会自动发动 TRANS-AM","马格亚那克队人多，正好克制单体刺客","高达的盾能挡下一次大伤害","最后 60 秒和加时阶段能量恢复翻倍"];
// 共享选卡组原型的存储（卡组、对手、AI）
let deckState={slot:0,decks:PRESETS.map(p=>p.cards.slice()),custom:[false,false,false],opp:1,ai:'新'};
try{const s=JSON.parse(localStorage.getItem('fd_deck_proto2')||'null');if(s&&s.decks&&s.decks.length===3)deckState=Object.assign(deckState,s)}catch(e){}
function saveDeck(){try{localStorage.setItem('fd_deck_proto2',JSON.stringify(deckState))}catch(e){}}
let hist=[];try{hist=JSON.parse(localStorage.getItem('fd_lobby_hist')||'[]')}catch(e){}
function saveHist(){try{localStorage.setItem('fd_lobby_hist',JSON.stringify(hist))}catch(e){}}
let sets={music:true,sfx:true,vib:false,q:2};try{Object.assign(sets,JSON.parse(localStorage.getItem('fd_lobby_set')||'{}'))}catch(e){}
function saveSets(){try{localStorage.setItem('fd_lobby_set',JSON.stringify(sets))}catch(e){}}

const myDeck=()=>deckState.decks[deckState.slot];
const deckName=i=>deckState.custom[i]?'自定义':PRESETS[i].name;
const avg=cards=>(cards.reduce((a,k)=>a+CARDS[k].cost,0)/cards.length).toFixed(1);
const wins=()=>hist.filter(h=>h.r==='胜').length;

function sp(file,[x,y,w,h],extra=''){return `<div class="sp" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(${SL}${file}.png);${extra}"></div>`}
function ti(file,[x,y,w,h],c){return `<div class="ti" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};-webkit-mask-image:url(${SL}${file}.png);mask-image:url(${SL}${file}.png)"></div>`}
function tx(t,x,y,size,color,anchor='mm',cls='',w=700){return `<div class="t ${anchor} ${cls}" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};font-weight:${w}">${t}</div>`}
function hit(x,y,w,h,fn,id='',press=''){return `<div class="hit" ${id?`id="${id}"`:''} ${press?`data-p="${press}" data-fn="${fn.replace(/"/g,'&quot;')}"`:`onclick="${fn}"`} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`}
// 一张卡：框 113×191 时美术区在 (4,32,105,122)，按比例缩放
function card(k,x,y,w=113){const c=CARDS[k],s=w/113,h=191*s;
  return sp('Art_'+c.art,[x+4*s,y+32*s,105*s,122*s])+sp('CardFrame',[x,y,w,h])+
   tx(c.cost,x+19*s,y+17*s,21*s,'#EDF2F6')+tx(c.name,x+56*s,y+167*s,(c.name.length>5?14:17)*s,'#17263A')}

// 按压组：grp(id,中心,内容)；hit 的 press 指向组 id
const grp=(id,[cx,cy],inner)=>`<div class="pg" id="${id}" style="transform-origin:${cx}px ${cy}px">${inner}</div>`;
function lobby(){
  const d=myDeck(),o=PRESETS[deckState.opp];
  let h=sp('Background',[0,0,1080,2340]);
  h+=tx('MS 战线对决',38,181,27,'#EDF2F6','lm','',900);
  // 玩家信息
  h+=grp('pgPlayer',[312,306],sp('PlayerPanel',[23,227,579,158])+
     `<div class="sp" style="left:46px;top:245px;width:125px;height:125px;background:#DCA822;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)"></div>`+sp('Icon_Avatar',[52,251,113,113])+
     ti('Icon_Trophy',[345,313,30,30],'#DCA822')+tx('指',108,305,58,'#EDF2F6')+tx('指挥官',231,275,42,'#17263A','lm','',900)+
     tx('Lv.1',236,333,27,'#17263A','lm')+tx(wins()*30,399,335,27,'#17263A','lm'));
  h+=grp('pgRes',[883,302],sp('ResourcePanel',[711,230,344,145])+
     ti('Icon_Coin',[747,254,30,30],'#E0B43A')+ti('Icon_Diamond',[747,319,30,30],'#6FC3F5')+ti('Icon_Lock',[990,254,30,30],'#AEB9C7')+ti('Icon_Lock',[990,319,30,30],'#AEB9C7')+
     tx('—',834,269,32,'#EDF2F6')+tx('—',834,335,32,'#EDF2F6'));
  h+=grp('pgSet',[1004,427],sp('SettingsButton',[956,392,96,70])+ti('Icon_Gear',[975,406,56,56],'#17263A'));
  h+=tx('竞技场 1',65,491,35,'#EDF2F6','lm','title')+tx('训练场',50,578,100,'#EDF2F6','lm','title',900)+tx('TRAINING HANGAR',56,659,30,'#ABB4C0','lm','',700);
  // 奖励槽
  let rw=sp('RewardsPanel',[65,873,358,319]);
  [[124,909],[286,909],[124,1049],[286,1049]].forEach(([x,y])=>rw+=ti('Icon_Chest',[x,y,77,57],'#9aa8ba')+ti('Icon_Lock',[x+26,y+32,29,29],'#D4DCE5'));
  [[163,993],[325,993],[163,1134],[325,1134]].forEach(([x,y])=>rw+=tx('即将开放',x,y,23,'#B6C0CF'));
  h+=grp('pgReward',[244,1032],rw);
  // 对战操作台：按“对战”时整块（底座、对战按钮、对手设置按钮、对手文字）一起下压
  h+=`<div class="pg" id="battleGrp">`+sp('BattleConsole',[527,747,532,510])+sp('BattleButton',[564,791,463,230])+
     ti('Icon_Battle',[601,879,83,83],'#152337')+`<div class="sp" style="left:700px;top:870px;width:6px;height:100px;background:#17263a55;transform:skewX(-12deg)"></div>`+
     tx('对战',860,913,96,'#17263A','mm','',900)+
     grp('pgOpp',[794,1084],sp('OpponentButton',[629,1049,330,70])+tx('对手设置',795,1084,37,'#17263A'))+
     tx('对手：AI 指挥官',793,1152,31,'#17263A')+tx(`（${o.name} · AI ${deckState.ai}）`,793,1196,27,'#17263A')+`</div>`;
  // 卡组
  let dk=sp('DeckPanel',[25,1535,1029,310])+tx(`卡组 ${deckState.slot+1} · ${deckName(deckState.slot)}`,161,1581,35,'#EDF2F6','lm','',900)+tx('平均费用',782,1581,30,'#EDF2F6','lm')+tx(avg(d),975,1581,40,'#2FD3E0','mm','',900);
  d.forEach((k,i)=>dk+=card(k,[51,174,296,419,542,664,787,910][i],1631));
  h+=grp('pgDeck',[540,1690],dk);
  // 底部导航
  h+=sp('NavRail',[0,2023,1080,149])+sp('NavSelected',[423,2003,220,168]);
  const nav=[['Shop','商店',67,104,'#8492A4','#BCC5D0',141],['Deck','卡组',282,318,'#EDF2F6','#EDF2F6',0],['Battle','对战',480,533,'#17263A','#17263A',0],['Book','图鉴',700,737,'#8492A4','#BCC5D0',780],['Event','活动',918,955,'#8492A4','#BCC5D0',988]];
  nav.forEach(([f,t,x,tx0,c,tc,lock],i)=>h+=grp('pgNav'+i,[tx0,2100],ti('Icon_'+f,[x,2054,73,73],c)+(lock?ti('Icon_Lock',[lock,2098,26,26],'#8492A4'):'')+tx(t,tx0,2140,27,tc)));
  // 点击区（press=按压组 id）
  h+=hit(23,227,579,158,'openHist()','','pgPlayer')+hit(956,392,96,70,'openSettings()','','pgSet')+hit(711,230,344,145,"toast('Demo 暂未开放')",'','pgRes');
  h+=hit(65,873,358,319,"toast('奖励箱：即将开放')",'','pgReward');
  h+=hit(564,791,463,230,'startVS()','bb','battleGrp');
  h+=hit(629,1049,330,70,'openOpp()','','pgOpp')+hit(25,1535,1029,310,'goDeck()','','pgDeck');
  h+=hit(0,2023,216,215,"toast('Demo 暂未开放')",'','pgNav0')+hit(216,2023,216,215,'goDeck()','','pgNav1')+hit(432,2003,216,235,'')+hit(648,2023,216,215,"toast('Demo 暂未开放')",'','pgNav3')+hit(864,2023,216,215,"toast('Demo 暂未开放')",'','pgNav4');
  $('scene').innerHTML=h;
  $('scene').querySelectorAll('.hit[data-p]').forEach(bindPress);
  return h;
}
// 按压：按下整组压下，手指移出按钮再松开不触发；短按也至少显示 90ms 压下态，松开回弹后再执行
let pressBusy=false;
function bindPress(el){
  const g=$(el.dataset.p),fn=el.dataset.fn;let t0=0,on=false;
  const inside=e=>{const r=el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};
  el.addEventListener('pointerdown',e=>{if(pressBusy||(e.button&&e.button!==0))return;
    try{el.releasePointerCapture(e.pointerId)}catch(_){}   // 触屏默认会捕获指针，释放后才能判断移出
    on=true;t0=performance.now();g.classList.add('press')});
  const cancel=()=>{if(!on)return;on=false;g.classList.remove('press')};
  el.addEventListener('pointerleave',cancel);el.addEventListener('pointercancel',cancel);
  el.addEventListener('pointerup',e=>{if(!on)return;on=false;
    if(!inside(e)){g.classList.remove('press');return}
    pressBusy=true;const wait=Math.max(0,90-(performance.now()-t0));
    setTimeout(()=>{g.classList.remove('press');setTimeout(()=>{pressBusy=false;fn&&new Function(fn)()},70)},wait)});
}
function goDeck(){location.href=DECK_URL}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}
function openPop(h){$('mask').classList.add('on');const p=$('pop');p.innerHTML=h;p.style.pointerEvents='auto'}
function closePop(){$('mask').classList.remove('on');const p=$('pop');p.innerHTML='';p.style.pointerEvents='none'}
const L=(t,x,y,size,color='#fff',w=700,anchor='mm')=>tx(t,x,y,size,color,anchor,'',w);

// L02 对手设置
let oppSel,aiSel;
function openOpp(){oppSel=deckState.opp;aiSel=deckState.ai;renderOpp()}
function renderOpp(){const x0=120,y0=560,c=PRESETS[oppSel].cards;
  let h=`<div class="mframe" style="left:${x0}px;top:${y0}px;width:840px;height:1120px"></div>`+L('对手设置',540,y0+70,44,'#17263A',900);
  h+=L('对手卡组',x0+70,y0+190,28,'#c9d3dd',700,'lm');
  h+=`<div class="seg" style="left:${x0+70}px;top:${y0+220}px;width:700px;height:70px;font-size:28px">`+PRESETS.map((p,i)=>`<div class="${i===oppSel?'on':''}" onclick="oppSel=${i};renderOpp()">${p.name}</div>`).join('')+`</div>`;
  c.forEach((k,i)=>h+=card(k,x0+64+(i%4)*182,y0+320+Math.floor(i/4)*196,150*0+113*1.0));
  h+=L(`平均费用 <span style="color:#2FD3E0">${avg(c)}</span>`,540,y0+735,28,'#c9d3dd');
  h+=L('AI',x0+70,y0+810,30,'#fff',700,'lm')+`<div class="seg" style="left:${x0+420}px;top:${y0+780}px;width:350px;height:62px;font-size:28px">`+['新','旧'].map(a=>`<div class="${a===aiSel?'on':''}" onclick="aiSel='${a}';renderOpp()">${a}</div>`).join('')+`</div>`;
  h+=L('设置保存在本机，选卡组界面的对战准备也会同步',540,y0+880,22,'#8c96a3',500);
  h+=`<div class="btn skin b-yel" style="left:${x0+220}px;top:${y0+975}px;width:400px;height:100px;font-size:40px" onclick="deckState.opp=oppSel;deckState.ai=aiSel;saveDeck();closePop();lobby();toast('对手已设置：'+PRESETS[oppSel].name+' · AI '+aiSel)">确定</div>`;
  openPop(h)}

// L04 设置
function openSettings(){const x0=120,y0=560;
  const row=(i,t)=>`<div style="position:absolute;left:${x0+60}px;top:${y0+190+i*120}px;width:720px;height:2px;background:#ffffff18"></div>`+L(t,x0+70,y0+250+i*120,32,'#fff',700,'lm');
  const sw=(i,k)=>`<div class="sw ${sets[k]?'on':''}" style="left:${x0+650}px;top:${y0+224+i*120}px" onclick="sets.${k}=!sets.${k};saveSets();openSettings()"><span style="${sets[k]?'left:16px':'right:14px'}">${sets[k]?'开':'关'}</span></div>`;
  let h=`<div class="mframe" style="left:${x0}px;top:${y0}px;width:840px;height:1100px"></div>`+L('设置',540,y0+70,44,'#17263A',900);
  h+=row(0,'音乐')+sw(0,'music')+row(1,'音效')+sw(1,'sfx')+row(2,'震动')+sw(2,'vib')+row(3,'画质');
  h+=`<div class="seg" style="left:${x0+420}px;top:${y0+582}px;width:350px;height:62px;font-size:28px">`+['低','中','高'].map((q,i)=>`<div class="${i===sets.q?'on':''}" onclick="sets.q=${i};saveSets();openSettings()">${q}</div>`).join('')+`</div>`;
  h+=row(4,'<span style="color:#8c96a3">语言</span>')+`<div class="t" style="left:${x0+770}px;top:${y0+730}px;font-size:28px;color:#8c96a3;font-weight:500;transform:translate(-100%,-50%)">简体中文 🔒</div>`;
  h+=L('Demo 0.1',540,y0+840,24,'#8c96a3',500);
  h+=`<div class="btn skin b-wht" style="left:${x0+220}px;top:${y0+930}px;width:400px;height:100px;font-size:40px" onclick="closePop()">关闭</div>`;
  openPop(h)}

// L05 战绩
function openHist(){const x0=120,y0=380,n=hist.length,w=wins(),l=hist.filter(h=>h.r==='负').length;
  let h=`<div class="mframe" style="left:${x0}px;top:${y0}px;width:840px;height:1500px"></div>`+L('最近战绩',540,y0+70,44,'#17263A',900);
  h+=`<div style="position:absolute;left:${x0+60}px;top:${y0+150}px;width:720px;height:76px;background:#0f1a28;border:2px solid #3b4d66"></div>`;
  h+=L(`${w} 胜`,x0+180,y0+188,30,'#FFD45C')+L(`${l} 负`,540,y0+188,30,'#FFD45C')+L(n?`${Math.round(w/n*100)}% 胜率`:'— 胜率',x0+660,y0+188,30,'#FFD45C');
  if(!n)h+=L('还没有对局记录',540,y0+640,34,'#c9d3dd',500)+L('点大厅的“对战”打一局（Demo 模拟结果）',540,y0+700,24,'#8c96a3',500);
  hist.slice(0,10).forEach((r,i)=>{const y=y0+270+i*96,col={胜:'#3DBE5A',负:'#E8413C',平:'#8C96A3'}[r.r];
    h+=`<div style="position:absolute;left:${x0+60}px;top:${y}px;width:720px;height:86px;border-bottom:2px solid #ffffff14"></div>`;
    h+=`<div style="position:absolute;left:${x0+70}px;top:${y+20}px;width:48px;height:48px;background:${col};border-radius:4px"></div>`+L(r.r,x0+94,y+44,26,'#fff',900);
    h+=L(r.score,x0+200,y+44,32,'#fff',900)+L(r.me,x0+290,y+30,26,'#fff',700,'lm')+L('对手 · '+r.opp,x0+290,y+64,20,'#8c96a3',500,'lm');
    h+=L(r.t,x0+720,y+30,26,'#fff',700)+L(r.ot?'加时':'常规',x0+720,y+64,20,'#8c96a3',500)});
  h+=`<div class="btn skin b-wht" style="left:${x0+220}px;top:${y0+1330}px;width:400px;height:100px;font-size:40px" onclick="closePop()">关闭</div>`;
  openPop(h)}

// L03 VS 加载 → 模拟结算
let vsTimer;
const VSL='../handoff/vs-armor-r01/slices/UI_FDLobby_VS_';
const vsp=(f,[x,y,w,h],ex='')=>`<div class="sp" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(${VSL}${f}.png);${ex}"></div>`;
const vtx=(t,x,y,size,color,it,anchor='mm',w=900)=>`<div class="t ${anchor}" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};font-weight:${w};${it?'font-style:italic;':''}">${t}</div>`;
// 入场时间按 handoff/vs-armor-r01/MOTION.md
function startVS(){if(vsRunning)return;vsRunning=true;const o=PRESETS[deckState.opp],d=myDeck(),V=$('vs');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let h=vsp('Background',[0,0,1080,2340]);
  h+=`<div class="g g-opp">`+vsp('OpponentPanel',[57,380,935,363])+vsp('OpponentBadge',[150,470,248,211])+
     vtx('对手',241,417,41,'#fff',1)+vtx('AI',272,578,95,'#F5EFE3',1)+vtx('AI 指挥官',676,549,74,'#16243A',1)+vtx(`对手卡组：${o.name} · AI ${deckState.ai}`,631,630,37,'#16243A',0,'mm',700)+`</div>`;
  h+=`<div class="g g-me">`+vsp('PlayerPanel',[56,1253,972,301])+vsp('PlayerBadge',[212,1315,221,179])+
     vtx('指',318,1410,83,'#F5EFE3',0)+vtx('指挥官',662,1381,75,'#16243A',1)+vtx(`我方卡组：${deckName(deckState.slot)}`,657,1461,38,'#16243A',0,'mm',700)+`</div>`;
  h+=`<div class="g g-deck">`+vsp('DeckPanel',[47,1572,985,293]);
  d.forEach((k,i)=>{const c=CARDS[k],x=88+i*115;
    h+=`<div class="g g-card" style="animation-delay:${650+i*35}ms">`+vsp('Art_'+c.art,[x+4,1656,97,106])+vsp('CardFrame',[x,1628,105,165])+
       vtx(c.cost,x+17,1641,21,'#fff',0,'mm',700)+vtx(c.name,x+53,1776,c.name.length>5?13:15,'#16243A',0,'mm',700)+`</div>`});
  h+=`</div><div class="g g-vs"><div class="g g-v">`+vsp('V',[255,850,361,310])+`</div><div class="g g-s">`+vsp('S',[475,829,356,333])+`</div></div>`;
  h+=`<div class="g g-flash">`+vsp('FX_Flash',[275,852,543,321],'mix-blend-mode:screen')+`</div>`;
  [[706,968,338],[713,1023,15],[648,1068,52],[537,1087,89],[425,1070,126],[357,1025,163],[360,971,200],[433,928,237],[547,914,274],[655,935,311]].forEach(([x,y,r])=>{
    const rad=r*Math.PI/180;h+=`<div class="g g-spark" style="--dx:${Math.cos(rad)*70}px;--dy:${Math.sin(rad)*70}px">`+vsp('FX_Streak',[x,y,99,25],`transform:rotate(${r}deg);mix-blend-mode:screen`)+`</div>`});
  h+=`<div class="g g-load">`+vtx(TIPS[Math.floor(Math.random()*TIPS.length)],540,1933,30,'#fff',1,'mm',700)+vtx('加载中…',103,2003,31,'#fff',1,'lm',700)+
     vsp('LoadingBed',[103,2040,892,35])+`<div id="vsFill" style="position:absolute;left:114px;top:2041px;width:778px;height:32px;clip-path:inset(0 100% 0 0)">`+vsp('LoadingFill',[0,0,778,32])+`</div>`+
     vsp('LoadingTrack',[71,2024,941,67])+`<div class="t mm" id="pct" style="left:941px;top:2058px;font-size:30px;color:#fff;font-weight:900;font-style:italic">0%</div></div>`;
  // 先等这一屏的图片解码完再开始入场，否则面板会比文字晚出来
  preload(urlsIn(h)).then(()=>runVS(V,h,reduce));}
let vsReady=null,vsRunning=false;
function runVS(V,h,reduce){
  V.innerHTML=h;V.classList.toggle('reduce',reduce);V.classList.add('on');V.classList.remove('anim');void V.offsetWidth;V.classList.add('anim');
  // 模拟真实加载：进度只增不减，入场（1.25s）后才允许到 100%
  let p=0;const t0=performance.now();clearInterval(vsTimer);
  vsTimer=setInterval(()=>{const el=performance.now()-t0;p=Math.min(el<1250?.95:1,p+Math.random()*.03+.01);
    $('vsFill').style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;$('pct').textContent=Math.floor(p*100)+'%';
    if(p>=1){clearInterval(vsTimer);setTimeout(()=>{V.classList.add('out');setTimeout(()=>{V.classList.remove('on','out','anim');V.innerHTML='';vsRunning=false;result()},180)},120)}},90)}
function result(){const o=PRESETS[deckState.opp],roll=Math.random(),r=roll<.55?'胜':roll<.9?'负':'平';
  const score=r==='胜'?(Math.random()<.3?'3 : 0':'2 : 1'):r==='负'?(Math.random()<.5?'0 : 1':'1 : 2'):'1 : 1';
  const ot=r==='平'||Math.random()<.4,sec=ot?180+Math.floor(Math.random()*60):120+Math.floor(Math.random()*60);
  hist.unshift({r,score,opp:o.name,me:deckName(deckState.slot),t:`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`,ot});hist=hist.slice(0,10);saveHist();
  const col={胜:'#FFD45C',负:'#E8413C',平:'#c9d3dd'}[r],x0=120,y0=780;
  let h=`<div class="mframe" style="left:${x0}px;top:${y0}px;width:840px;height:880px"></div>`+L('对局结束（Demo 模拟）',540,y0+70,40,'#17263A',900);
  h+=L({胜:'胜利',负:'失败',平:'平局'}[r],540,y0+260,110,col,900).replace('class="t mm','class="t mm title');
  h+=L(score,540,y0+400,56,'#fff',900)+L(`对手：${o.name} · ${ot?'加时':'常规'} · ${hist[0].t}`,540,y0+470,26,'#c9d3dd',500);
  if(r==='胜')h+=L('战功 +30',540,y0+530,30,'#DCA822',900);
  h+=`<div class="btn skin b-yel" style="left:${x0+220}px;top:${y0+720}px;width:400px;height:100px;font-size:38px" onclick="closePop();lobby()">返回大厅</div>`;
  openPop(h)}

// L06 启动页（每个会话一次，点击可跳过）
function splash(){let seen=false;try{seen=sessionStorage.getItem('fd_splash')}catch(e){}
  if(seen)return;try{sessionStorage.setItem('fd_splash','1')}catch(e){}
  const S=$('splash');S.innerHTML=`<div class="band" style="top:300px"></div><div class="band" style="top:1500px"></div>`+
   L('MS 战线对决',540,1000,96,'#EDF2F6',900).replace('class="t mm','class="t mm title').replace('MS','<span style="color:#DCA822">MS</span>')+
   L('MOBILE SUIT FRONTLINE DUEL',540,1110,30,'#ABB4C0',700)+L('加载中…',540,1990,28,'#EDF2F6',500)+`<div class="bar"><i id="sbar"></i></div>`+L('© 版权信息待定',540,2190,22,'#8c96a3',500);
  S.classList.add('on');let p=0,ok=false;lobbyReady.then(()=>ok=true);
  // 大厅资源没到齐前进度停在 90%，到齐后才走完并淡出
  const t=setInterval(()=>{p=Math.min(ok?100:90,p+3);$('sbar').style.width=`calc(${p}% - 8px)`;if(p>=100){clearInterval(t);hide()}},70);
  const hide=()=>{S.classList.add('out');setTimeout(()=>S.classList.remove('on','out'),200)};
  S.onclick=()=>{if(!ok)return;clearInterval(t);hide()}}

// 预加载：等图片下载并解码完
const _loaded={};
function preload(urls){return Promise.all([...new Set(urls)].map(u=>_loaded[u]||(_loaded[u]=new Promise(r=>{const i=new Image();
  i.onload=()=>(i.decode?i.decode():Promise.resolve()).catch(()=>{}).then(r);i.onerror=()=>r();i.src=u}))))}
const urlsIn=html=>[...html.matchAll(/url\(([^)]+)\)/g)].map(m=>m[1].replace(/["']|&quot;/g,''));
const fontsReady=()=>Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,3000))]);
// 弹窗、按钮皮肤在 CSS 里，也一起预加载
const SKIN=['UI_FDDeck_Button_Yellow','UI_FDDeck_Button_White','UI_FDDeck_Modal_Tactic'].map(n=>`../../deck/handoff/armor-r03/sprites/${n}.png`);
const VS_FILES=['Background','OpponentPanel','OpponentBadge','PlayerPanel','PlayerBadge','DeckPanel','V','S','FX_Flash','FX_Streak','LoadingBed','LoadingFill','LoadingTrack'].map(n=>VSL+n+'.png');

function fit(){const de=document.documentElement,W=de.clientWidth||innerWidth,H=de.clientHeight||innerHeight;
  const s=Math.min(W/1080,H/2340),w=$('wrap');w.style.transform=`scale(${s})`;w.style.left=((W-1080*s)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
// iOS Safari 需要 touchstart 监听，:active 按压态才会生效
document.addEventListener('touchstart',()=>{},{passive:true});
$('mask').onclick=()=>{closePop();lobby()};
const lobbyHtml=lobby();
const lobbyReady=Promise.all([preload(urlsIn(lobbyHtml)),fontsReady()]);
const toBattle=location.hash==='#battle';
if(toBattle){try{sessionStorage.setItem('fd_splash','1')}catch(e){}history.replaceState(null,'',location.pathname)}
(async()=>{
  // 启动页只依赖字体，先出启动页；没有启动页时等大厅全部到齐再整屏显示
  let seen=toBattle;try{seen=seen||sessionStorage.getItem('fd_splash')}catch(e){}
  if(!seen){await fontsReady();$('canvas').classList.remove('boot');splash();await lobbyReady}
  else{await lobbyReady;if(toBattle){vsReady=preload(VS_FILES.concat(urlsIn(lobbyHtml)));await vsReady}
    const c=$('canvas');c.classList.remove('boot');c.classList.add('reveal')}
  if(toBattle)startVS();
  preload(SKIN);if(!vsReady)vsReady=preload(VS_FILES.concat(Object.values(CARDS).map(c=>VSL+'Art_'+c.art+'.png'),[VSL+'CardFrame.png']));
})();
addEventListener('pageshow',e=>{if(e.persisted){try{const s=JSON.parse(localStorage.getItem('fd_deck_proto2')||'null');if(s&&s.decks)deckState=Object.assign(deckState,s)}catch(_){}lobby()}});
</script>
</body>
