<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>战斗原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Armor;src:url(../../deck/handoff/armor-r03/fonts/ArmorUIReviewR03.ttf);font-weight:100 900;font-display:block}
:root{--ink:#111E2B;--cyan:#2FD3E0;--gold:#FFD45C;--blue:#3D7BFF;--red:#E8413C;--F:Armor,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1724;overflow:hidden;font-family:var(--F)}
#wrap{position:fixed;left:0;top:0;width:1080px;height:2340px;transform-origin:top left}
#canvas{position:relative;width:1080px;height:2340px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;background:#0d1724}
#canvas.boot>*{visibility:hidden}
#canvas.boot::after{content:"加载中…";position:absolute;left:0;right:0;top:1150px;text-align:center;color:#8c96a3;font:500 36px sans-serif;visibility:visible}
#fx{position:absolute;left:0;top:0;width:1080px;height:2340px}
.t{position:absolute;white-space:nowrap;line-height:1;font-weight:700;pointer-events:none}
.mm{transform:translate(-50%,-50%)} .lm{transform:translateY(-50%)}
.skin{border-style:solid;border-color:transparent}
.armor{border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_White.png) 30 fill/30px stretch}
.b-yel{border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_Yellow.png) 30 fill/30px stretch}
.b-wht{border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_White.png) 30 fill/30px stretch}
.b-red{border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Button_White.png) 30 fill/30px stretch;filter:hue-rotate(-10deg)}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;color:var(--ink);transition:transform .08s,filter .08s}
.btn.press,.btn:active{transform:scale(.95);filter:brightness(.9)}
/* 顶栏 */
#top{position:absolute;left:0;top:120px;width:1080px;height:160px;background:url(../handoff/battle-r01/UI_FDBattle_TopBar.png) 0 0/100% 100%}
.crowns{position:absolute;display:flex;gap:10px}
.crown{width:52px;height:44px;background:url(../handoff/battle-r01/UI_FDBattle_Crown_Empty.png) center/contain no-repeat;transition:transform .2s}
.crown.b{background-image:url(../handoff/battle-r01/UI_FDBattle_Crown_Blue.png);filter:drop-shadow(0 0 6px #4AA3FF)}
.crown.r{background-image:url(../handoff/battle-r01/UI_FDBattle_Crown_Red.png);filter:drop-shadow(0 0 6px #FF5A4E)}
.crown svg{width:100%;height:100%;display:block}
#timer{position:absolute;left:420px;top:132px;width:240px;height:120px;background:url(../handoff/battle-r01/UI_FDBattle_TimerFrame.png) 0 0/100% 100%}
#timer.ot{background-image:url(../handoff/battle-r01/UI_FDBattle_TimerFrame_Overtime.png);box-shadow:0 0 18px #e8413c88}
#tval{position:absolute;left:120px;top:78px;font-size:60px;color:#fff;font-weight:900;transform:translate(-50%,-50%)}
#tval.warn{color:#FF5A4E}
#tval.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1.35)}100%{transform:translate(-50%,-50%) scale(1)}}
#phase{position:absolute;left:540px;top:276px;transform:translate(-50%,-50%);font-size:28px;font-weight:900;padding:6px 22px;border-radius:6px;background:#0e1a29dd;display:none}
/* 底栏 */
#bot{position:absolute;left:0;top:1800px;width:1080px;height:438px;background:url(../handoff/battle-r01/UI_FDBattle_BottomPanel.png) 0 0/100% 100%}
#botIn{display:none}
.hc{position:absolute;width:200px;height:287px;top:1866px;transition:transform .12s,filter .15s;cursor:pointer;touch-action:none}
.hc canvas{width:100%;height:100%;display:block;pointer-events:none}
.hc .shade{position:absolute;left:4px;right:4px;bottom:4px;border-radius:0 0 6px 6px;background:linear-gradient(#d85bff55,#9b3bd955);pointer-events:none;height:0}
.hc.poor canvas{filter:grayscale(1) brightness(.55)}
.hc.poor::before{content:"";position:absolute;inset:0;background:url(../handoff/battle-r01/UI_FDBattle_HandCard_Shade.png) 0 0/100% 100%;z-index:1;pointer-events:none;opacity:.6}
.hc.flash{animation:cflash .3s ease-out}
@keyframes cflash{0%{filter:brightness(2.2)}100%{filter:none}}
.hc.sel{transform:translateY(-18px) scale(1.06)}
.hc.sel::after{content:"";position:absolute;inset:-6px;border:5px solid var(--cyan);border-radius:12px;box-shadow:0 0 18px var(--cyan);pointer-events:none}
.hc.lift{opacity:.35}
.hc.deal{animation:deal .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes deal{from{transform:translate(var(--dx),40px) scale(.55);opacity:0}to{transform:none;opacity:1}}
#next{position:absolute;left:36px;top:1890px;width:124px;height:178px}
#next canvas{width:100%;height:100%}
#nextCd{position:absolute;left:98px;top:1979px;transform:translate(-50%,-50%);font-size:30px;color:#fff;font-weight:900;display:none}
#gem{position:absolute;left:24px;top:2150px;width:96px;height:96px;background:url(../handoff/battle-r01/UI_FDBattle_EnergyGem.png) 0 0/100% 100%}
#gem.gold{filter:hue-rotate(125deg) saturate(1.5) brightness(1.25)}
#gemN{position:absolute;left:72px;top:2200px;transform:translate(-50%,-50%);font-size:52px;color:#fff;font-weight:900;text-shadow:0 3px 0 #4a0f6a,0 0 6px #000}
#x2{position:absolute;left:92px;top:2124px;width:64px;height:40px;line-height:40px;text-align:center;font-size:26px;font-weight:900;color:var(--gold);background:url(../handoff/battle-r01/UI_FDBattle_X2.png) 0 0/100% 100%;display:none;z-index:2}
#ebar{position:absolute;left:132px;top:2170px;width:912px;height:56px;background:url(../handoff/battle-r01/UI_FDBattle_EnergyBar.png) 0 0/100% 100%;border-radius:6px}
#efill{display:none}
#esegs{position:absolute;inset:0}
#ebar.full{animation:efull .8s ease-in-out infinite alternate}
@keyframes efull{from{box-shadow:0 0 0 #d85bff00}to{box-shadow:0 0 22px #f2a6ff;border-color:#f2a6ff}}
#esegs i{position:absolute;top:5px;height:46px;width:85px;overflow:hidden;border-radius:3px}
#esegs i b{position:absolute;left:0;top:0;bottom:0;width:0;-webkit-mask:url(../handoff/battle-r01/UI_FDBattle_EnergyFill.png) 0 0/85px 46px;mask:url(../handoff/battle-r01/UI_FDBattle_EnergyFill.png) 0 0/85px 46px;background:linear-gradient(#e889ff,#b23be6 55%,#8a25c4)}
#ebar.gold #esegs i b{background:linear-gradient(#fff1b8,#FFD45C 55%,#d39614)}
#esegs i.blink{animation:eblink .35s ease-out}
@keyframes eblink{0%{background:#fff9}100%{background:transparent}}
/* 拖拽 */
#drag{position:absolute;width:186px;height:267px;pointer-events:none;z-index:30;display:none;transform:translate(-50%,-70%) scale(.9);transition:width .1s,height .1s}
#drag canvas{width:100%;height:100%;filter:drop-shadow(0 12px 16px #000c)}
#drag.mini{width:72px;height:103px;transform:translate(-50%,-230%);opacity:.9}
/* 横幅 */
#banner{position:absolute;left:40px;top:950px;width:1000px;height:220px;z-index:25;display:none;pointer-events:none;background:url(../handoff/battle-r01/UI_FDBattle_Banner.png) 0 0/100% 100%}
#banner .bt{position:absolute;left:500px;top:110px;transform:translate(-50%,-50%);font-size:96px;font-weight:900;font-style:italic;letter-spacing:4px;white-space:nowrap}
#banner.in{display:block;animation:bIn .2s cubic-bezier(.2,.8,.3,1.2) both}
#banner.out{display:block;animation:bOut .2s ease-in both}
@keyframes bIn{from{transform:scaleY(.1) translateX(-200px);opacity:0}to{transform:none;opacity:1}}
@keyframes bOut{from{transform:none;opacity:1}to{transform:translateX(260px);opacity:0}}
#count{position:absolute;left:540px;top:1060px;transform:translate(-50%,-50%);font-size:260px;font-weight:900;color:#fff;font-style:italic;text-shadow:0 10px 0 #0a1320,0 0 30px #000a;z-index:26;display:none;pointer-events:none}
#count.pop{display:block;animation:cpop .6s ease-out both}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:0}}
/* 皇冠飞行 */
.fly{position:absolute;width:64px;height:54px;z-index:28;pointer-events:none;transition:left .7s cubic-bezier(.5,0,.3,1),top .7s cubic-bezier(.5,-.4,.3,1),transform .7s}
/* 弹窗 */
.mask{position:absolute;inset:0;background:#000a;z-index:40;display:none}
.mask.on{display:block}
.mframe{position:absolute;border-style:solid;border-color:transparent;border-width:160px 40px 200px 40px;border-image:url(../../deck/handoff/armor-r03/sprites/UI_FDDeck_Modal_Tactic.png) 160 40 200 40 fill stretch;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#pop{position:absolute;inset:0;z-index:41;pointer-events:none}
/* 结算 */
#res{position:absolute;inset:0;z-index:45;display:none;background:#05090fb8}
#res.on{display:block;animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rtitle{position:absolute;left:90px;width:900px;height:220px;top:760px;background:url(../handoff/battle-r01/UI_FDBattle_Result_Win.png) 0 0/100% 100%;animation:bIn .3s .2s cubic-bezier(.2,.8,.3,1.2) both}
.rbig{position:absolute;left:450px;top:110px;transform:translate(-50%,-50%);font-size:120px;font-weight:900;font-style:italic;letter-spacing:8px}
.rrow{position:absolute;left:140px;width:800px;height:150px;background:#0e1a29e6;border:4px solid #3d5470;border-radius:12px;animation:fadeIn .3s both}
.rc{display:flex;gap:18px;position:absolute;right:40px;top:40px}
.rc .crown{width:84px;height:70px}
.rc .crown.lit{animation:clit .35s cubic-bezier(.2,.8,.3,1.4) both}
@keyframes clit{0%{transform:scale(1.8);filter:brightness(2)}100%{transform:none}}
#toast{position:absolute;left:50%;top:1720px;transform:translateX(-50%);background:#111e2bee;color:#fff;border:2px solid var(--cyan);padding:18px 34px;border-radius:8px;font-size:32px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* VS（复用 L03 厚装甲切图），结束时上下分开露出战场 */
#vs{position:absolute;inset:0;z-index:50;display:none;overflow:hidden}
#vs.on{display:block}
#vs .g{position:absolute;left:0;top:0;width:1080px;height:2340px;pointer-events:none}
#vs .bg{transition:opacity .35s .1s}
#vs .up,#vs .dn{transition:transform .42s cubic-bezier(.6,0,.8,.4)}
#vs.split .bg{opacity:0}
#vs.split .up{transform:translateY(-1300px)}
#vs.split .dn{transform:translateY(1300px)}
#vs.split .mid{transition:opacity .2s,transform .3s;opacity:0;transform:scale(1.4)}
#vs.anim .g-opp{animation:vsInL .34s cubic-bezier(.2,.7,.3,1) both}
#vs.anim .g-me{animation:vsInR .34s .08s cubic-bezier(.2,.7,.3,1) both}
#vs.anim .g-v{animation:vsV .24s .25s cubic-bezier(.6,0,.9,.5) both}
#vs.anim .g-s{animation:vsS .24s .25s cubic-bezier(.6,0,.9,.5) both}
#vs.anim .g-flash{opacity:0;animation:vsFlash .16s .49s ease-out}
#vs.anim .g-deck{animation:vsUp .3s .55s cubic-bezier(.2,.7,.3,1) both}
#vs.anim .g-load{animation:vsFade .25s .6s both}
@keyframes vsInL{from{transform:translateX(-180px);opacity:0}to{transform:none;opacity:1}}
@keyframes vsInR{from{transform:translateX(180px);opacity:0}to{transform:none;opacity:1}}
@keyframes vsV{from{transform:translateX(-360px) scale(1.15);opacity:0}to{transform:none;opacity:1}}
@keyframes vsS{from{transform:translateX(360px) scale(1.15);opacity:0}to{transform:none;opacity:1}}
@keyframes vsFlash{from{opacity:1}to{opacity:0}}
@keyframes vsUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes vsFade{from{opacity:0}to{opacity:1}}
.sp{position:absolute;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
#note{position:fixed;left:16px;top:16px;width:260px;color:#9fb3cc;font:14px/1.6 system-ui,sans-serif;display:none}
#note b{color:#fff}
@media (min-width:1100px){#note{display:block}}
@media (prefers-reduced-motion: reduce){#vs *{animation:none!important}}
</style>
</head>
<body>
<div id="note"><b>MS战线对决 · 战斗原型</b><br>按 31 文档布局做的简化对局（数值示意）。<br>· 按住手牌拖进战场出兵，或点卡再点地<br>· 机体只能放己方半场（蓝格），战术卡和渣古降下全场可放<br>· 最后 60 秒双倍能量，平局进加时<br>· 右上「退出」判负<br>参数：?speed=3 加速、?t=70 从 1:10 开始、?auto=1 我方也由 AI 出牌、?skip=1 跳过 VS</div>
<div id="wrap"><div id="canvas" class="boot">
  <canvas id="fx" width="1080" height="2340"></canvas>
  <div id="top"></div>
  <div class="t lm" style="left:36px;top:164px;font-size:32px;color:#17263A;font-weight:900" id="oppName">AI 指挥官</div>
  <div class="crowns" id="eCrowns" style="left:36px;top:202px;gap:12px"></div>
  <div id="timer"><div class="t mm" style="left:120px;top:28px;font-size:22px;color:#9fb3cc">剩余时间</div><div id="tval">3:00</div></div>
  <div class="btn skin b-wht" id="exitBtn" style="left:924px;top:140px;width:120px;height:80px;font-size:30px;border-width:20px">退出</div>
  <div id="phase"></div>
  <div id="bot"></div>
  <div id="botIn"></div>
  <div class="t lm" style="left:36px;top:1836px;font-size:26px;color:#17263A;font-weight:900">我方</div>
  <div class="crowns" id="pCrowns" style="left:110px;top:1818px;gap:12px"></div>
  <div class="t mm" style="left:98px;top:1872px;font-size:20px;color:#c9d3dd">下一张</div>
  <div id="next"></div><div id="nextCd"></div>
  <div id="hand"></div>
  <div id="gem"></div><div id="gemN">5</div><div id="x2">×2</div>
  <div id="ebar"><div id="efill"></div><div id="esegs"></div></div>
  <div id="drag"></div>
  <div id="banner"><div class="bt" id="btext"></div></div>
  <div id="count"></div>
  <div id="res"></div>
  <div class="mask" id="mask"></div>
  <div id="pop"></div>
  <div id="vs"></div>
  <div id="toast"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const SPEED=+Q.get('speed')||1, AUTO=Q.get('auto')==='1', SKIP=Q.get('skip')==='1', T0=+Q.get('t')||180;
const SP2='../../deck/handoff/armor-r02/sprites/', SP3='../../deck/handoff/armor-r03/sprites/', VSL='../../lobby/handoff/vs-armor-r01/slices/UI_FDLobby_VS_';
const ROLE={"盾卫":"#3D7BFF","突击":"#E8413C","小队":"#3DBE5A","刺客":"#9B5CFF","清群":"#22C7D6","攻城":"#FF8A1F","射手":"#F2C230","狙击":"#FF6FB1","支援":"#8C96A3","战术":"#E6EDF5"};
// ---------- 卡表（数值取 30 文档 / 选卡组原型；这里只做手感示意） ----------
// spd 米/秒；rng 0.8 = 近战；size 0 小 1 中 2 大
const CARDS={
 missile:{name:"飞弹齐射",cost:2,role:"战术",art:"missile",tac:{r:3,dmg:240,bld:.3,stun:.5,delay:.6}},
 mega:{name:"米加粒子炮击",cost:4,role:"战术",art:"beam",tac:{r:2.5,dmg:520,bld:.35,delay:.9}},
 char:{name:"夏亚渣古",cost:3,role:"突击",art:"red",hp:600,dmg:115,itv:1.2,rng:.8,spd:1.5,size:1,n:1,skill:'charge'},
 drop:{name:"渣古降下",cost:3,role:"小队",art:"green",hp:170,dmg:60,itv:1.1,rng:.8,spd:1.2,size:0,n:3,anywhere:true,land:{r:1.6,dmg:60}},
 gundam:{name:"高达",cost:4,role:"盾卫",art:"blue",hp:950,shield:330,dmg:130,itv:1.5,rng:4.5,spd:1.1,size:1,n:1},
 freedom:{name:"自由",cost:4,role:"清群",art:"noart",hp:620,dmg:125,itv:1.4,rng:5.5,spd:1.1,size:1,n:1,skill:'fullburst'},
 exia:{name:"能天使",cost:5,role:"刺客",art:"purple",hp:1050,dmg:230,itv:1.3,rng:.8,spd:1.25,size:1,n:1,skill:'transam'},
 x:{name:"高达X",cost:6,role:"攻城",art:"orange",hp:2400,dmg:140,itv:1.7,rng:5,spd:.8,size:2,n:1,bOnly:true,skill:'sat'},
 guncannon:{name:"钢加农",cost:4,role:"射手",art:"red",hp:520,dmg:150,itv:1.3,rng:6,spd:1.1,size:1,n:1},
 dynames:{name:"力天使",cost:3,role:"狙击",art:"blue",hp:230,dmg:150,bld:.5,itv:2.4,rng:8.5,spd:1.1,size:1,n:1},
 psycho:{name:"精神力",cost:7,role:"盾卫",art:"noart",hp:3000,dmg:160,splash:1.3,itv:1.7,rng:1.2,spd:.8,size:2,n:1,land:{r:2.2,dmg:240}},
 maganac:{name:"马格亚那克",cost:3,role:"小队",art:"green",hp:90,dmg:55,itv:1,rng:.8,spd:1.3,size:0,n:8},
 flag:{name:"旗帜式小队",cost:2,role:"小队",art:"noart",hp:190,dmg:60,itv:.9,rng:.8,spd:2,size:0,n:3,fly:true},
 geara:{name:"基拉·多加",cost:3,role:"射手",art:"noart",hp:220,dmg:45,itv:.5,rng:6.5,spd:1.5,size:1,n:1}
};
const PRESETS=[{name:"原版",cards:["missile","char","drop","gundam","freedom","mega","exia","x"]},{name:"远程",cards:["missile","dynames","drop","gundam","freedom","guncannon","mega","x"]},{name:"诱饵套",cards:["flag","char","drop","maganac","geara","dynames","gundam","psycho"]}];
const TIPS=["自由的全弹发射能同时瘫痪 5 台机体","飞弹齐射能打断高达X 的卫星炮蓄力","渣古降下可以扔到全场任何地方","能天使血量低于一半会自动发动 TRANS-AM","马格亚那克队人多，正好克制单体刺客","高达的盾能挡下一次大伤害","最后 60 秒和加时阶段能量恢复翻倍"];
let ds={slot:0,decks:PRESETS.map(p=>p.cards.slice()),opp:1,ai:'新'};
try{const s=JSON.parse(localStorage.getItem('fd_deck_proto2')||'null');if(s&&s.decks&&s.decks.length===3)ds=Object.assign(ds,s)}catch(e){}
const myCards=ds.decks[ds.slot].filter(k=>CARDS[k]).slice(0,8), oppPreset=PRESETS[ds.opp]||PRESETS[1];
const deckName=i=>{try{return (ds.custom&&ds.custom[i])?'自定义':PRESETS[i].name}catch(e){return ''}};

// ---------- 投影：18×32 米场地，上窄下宽的示意透视 ----------
const FY0=1786,FY1=440,PXM=56,TAPER=.25;
function tOf(wy){return (wy+16)/32}
function P(wx,wy){const t=tOf(wy),g=(t-.125*t*t)/.875,s=1-TAPER*t;return [540+wx*PXM*s,FY0-(FY0-FY1)*g,s]}
function W(sx,sy){const g=(FY0-sy)/(FY0-FY1),d=1-.4375*g;const t=d<0?1:(1-Math.sqrt(d))/.25,s=1-TAPER*t;return [(sx-540)/(PXM*s),t*32-16]}

// ---------- 状态 ----------
let G;
function newGame(){
  const towers=[];
  [['P',-1],['E',1]].forEach(([side,sg])=>{
    towers.push({side,x:-5.5,y:11.5*sg,r:1.1,hp:2400,max:2400,rng:7.5,dmg:90,itv:1,cd:0,king:false,active:true,lane:-1});
    towers.push({side,x:5.5,y:11.5*sg,r:1.1,hp:2400,max:2400,rng:7.5,dmg:90,itv:1,cd:0,king:false,active:true,lane:1});

function play(side,i,x,y){const S=G[side],k=S.hand[i],c=CARDS[k];if(S.e<c.cost||!canDeploy(side,k,x,y))return false;

  if(!c.tac&&k!=='drop'&&k!=='psycho')G.fx.push({k:'dep',x,y,t:0,d:1,col:side==='P'?'#4AA3FF':'#FF5A4E'});
  if(k==='drop'||k==='psycho')G.fx.push({k:'warn',x,y,r:c.land.r,t:0,d:k==='drop'?(side==='P'?(y>0?1.8:1.2):(y<0?1.8:1.2)):1.5,col:side==='P'?'#4AA3FF':'#FF5A4E'});
  if(c.tac)G.fx.push({k:'aim',x,y,r:c.tac.r,t:0,d:c.tac.delay,col:'#ffffff'});
  S.hand[i]=S.next;S.queue.push(k);S.next=S.queue.shift();
  if(side==='P'){blinkSegs(e0,S.e);refill(i);txt(x,y,'-'+c.cost,'#e889ff')}
  return true}
function refill(i){const d=document.querySelector(`.hc[data-i="${i}"]`);if(!d)return;
  d.innerHTML='';d.appendChild(cardEl(G.P.hand[i]));const s=document.createElement('div');s.className='shade';d.appendChild(s);
  d.classList.remove('deal','lift','sel');d.style.setProperty('--dx',(-HX[i]+60)+'px');void d.offsetWidth;d.style.animationDelay='0ms';d.classList.add('deal');
  $('next').innerHTML='';const cd=$('nextCd');cd.style.display='block';cd.textContent='1秒';
  clearTimeout(refill.t);refill.t=setTimeout(()=>{cd.style.display='none';setNext()},1000/Math.min(SPEED,3));hud()}

function toCanvas(e){const r=$('canvas').getBoundingClientRect();return [(e.clientX-r.left)/r.width*1080,(e.clientY-r.top)/r.height*2340]}
function bindCard(d){

  d.addEventListener('pointermove',e=>{if(!drag||drag.el!==d)return;const [cx,cy]=toCanvas(e);
    if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){drag.moved=true;d.classList.add('lift');clearSel();
      const g=$('drag');g.innerHTML='';g.appendChild(cardEl(G.P.hand[drag.i]));g.style.display='block'}
    if(drag.moved){const g=$('drag');g.style.left=cx+'px';g.style.top=cy+'px';const inField=cy<1790&&cy>290;g.classList.toggle('mini',inField);
      ghost=inField?mkGhost(G.P.hand[drag.i],cx,cy-60):null}});
  const up=e=>{if(!drag||drag.el!==d)return;const dd=drag;drag=null;$('drag').style.display='none';d.classList.remove('lift');
    if(!dd.moved){toggleSel(dd.i);return}
    const g=ghost;ghost=null;if(!g)return;tryPlay(dd.i,g)};

function mkGhost(k,cx,cy){const [x,y]=W(cx,cy);return {k,x,y,ok:canDeploy('P',k,x,y)}}
function tryPlay(i,g){const k=G.P.hand[i],c=CARDS[k];
  if(!g.ok){toast(c.tac||c.anywhere?'超出场地':'只能放在己方半场');return false}
  if(G.P.e<c.cost){toast('能量不足');return false}
  play('P',i,g.x,g.y);return true}
function toggleSel(i){if(G.sel===i){clearSel();return}clearSel();G.sel=i;document.querySelector(`.hc[data-i="${i}"]`).classList.add('sel')}

$('fx').addEventListener('pointerdown',e=>{if(G.phase!=='play'||G.sel<0)return;const [cx,cy]=toCanvas(e);if(cy>1790||cy<290)return;
  const g=mkGhost(G.P.hand[G.sel],cx,cy);ghost=g;const i=G.sel;setTimeout(()=>{if(tryPlay(i,g))clearSel();ghost=null},90)});
$('fx').addEventListener('pointermove',e=>{if(G.sel<0||drag)return;const [cx,cy]=toCanvas(e);if(cy<1790&&cy>290&&e.pointerType==='mouse')ghost=mkGhost(G.P.hand[G.sel],cx,cy)});

  const c=document.createElement('canvas');c.width=1080;c.height=2340;const G0=g;const x=c.getContext('2d');

    g.save();quad(x0,pocket?5:1.4,x1,15.6);g.clip();g.fillStyle='#E8413C18';g.fillRect(0,290,1080,1500);g.strokeStyle='#E8413C55';g.lineWidth=4;

function drawGhost(gh){const c=CARDS[gh.k],col=gh.ok?'#ffffff':'#FF5A4E';
  if(c.tac){ell(gh.x,gh.y,c.tac.r,gh.ok?'#ffffff22':'#ff5a4e22',col,4);return}
  if(c.land)ell(gh.x,gh.y,c.land.r,'#4AA3FF22','#4AA3FF',4);
  if(c.rng>1.5)rangeCircle(gh.x,gh.y,c.rng+.55);
  formation(c.n,gh.x,gh.y,1).forEach(([x,y])=>{g.globalAlpha=.55;unitShape(x,y,[.4,.55,.8][c.size],gh.ok?'#4AA3FF':'#FF5A4E',c.name,c.n>1);g.globalAlpha=1})}

function unitShape(x,y,r,col,name,small,u){const [sx,sy,s]=P(x,y),R=r*PXM*s,H=(small?.9:1.3)*R+R*.4,lift=u&&u.fly?22*s:0;

  g.fillStyle=u&&u.hit>0?'#fff':shade(col,-.35);g.beginPath();g.ellipse(sx,yy,R,R*.55,0,0,7);g.fill();
  g.fillRect(sx-R,yy-H,R*2,H);
  g.fillStyle=u&&u.hit>0?'#fff':col;g.beginPath();g.ellipse(sx,yy-H,R,R*.55,0,0,7);g.fill();
  g.strokeStyle='#0a1320';g.lineWidth=2.5;g.beginPath();g.ellipse(sx,yy-H,R,R*.55,0,0,7);g.stroke();
  g.fillStyle='#e9eef4';g.beginPath();g.ellipse(sx,yy-H,R*.45,R*.25,0,0,7);g.fill();
  if(!small){g.font=`700 ${Math.round(20*s)}px "Noto Sans SC",sans-serif`;g.textAlign='center';g.textBaseline='top';g.lineWidth=4;g.strokeStyle='#0a1320';g.strokeText(name,sx,sy+R*.5);g.fillStyle='#fff';g.fillText(name,sx,sy+R*.5)}
  return yy-H}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v*(1+p))));return `rgb(${f(r)},${f(gg)},${f(b)})`}
function hpBar(x,top,w,o,col){const h=10,f=Math.max(0,o.hp/o.max),gh=Math.max(f,o.ghost/o.max);

function drawTower(t){const [sx,sy,s]=P(t.x,t.y),R=t.r*PXM*s,col=t.side==='P'?'#3D7BFF':'#E8413C';

  g.fillStyle='#5d6878';g.fillRect(X-R,sy-H,R*2,H);g.fillStyle=shade(col,-.2);g.fillRect(X-R,sy-H*.45,R*2,H*.45);
  g.fillStyle=t.active?'#d9d4c8':'#9aa3ad';g.beginPath();g.ellipse(X,sy-H,R,R*.55,0,0,7);g.fill();g.strokeStyle='#0a1320';g.lineWidth=3;g.stroke();
  g.fillStyle=col;g.fillRect(X-R*.35,sy-H-R*.5,R*.7,R*.5);g.fillStyle='#0a1320';g.fillRect(X-R*.1,sy-H-R*.95,R*.2,R*.5);

  g.font='900 26px "Noto Sans SC",sans-serif';g.textAlign='center';g.textBaseline='bottom';g.lineWidth=5;g.strokeStyle='#0a1320';g.strokeText(Math.ceil(t.hp),X,top-4);g.fillStyle='#fff';g.fillText(Math.ceil(t.hp),X,top-4);
  if(t.king&&!t.active){g.font='900 22px sans-serif';g.textBaseline='middle';g.fillStyle='#c9d3dd';g.fillText('休眠',X-w/2-34,top+12)}}
function drawUnit(u){const c=CARDS[u.k],col=u.side==='P'?'#3D7BFF':'#E8413C';
  const a=u.dep>0?Math.max(.15,1-u.dep/u.depMax):1;g.globalAlpha=a;

    g.fillStyle='#0a1320cc';g.fillRect(sx+w/2+4,top-36,30,30);g.fillStyle=ic[1];g.font='900 22px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ic[0],sx+w/2+19,top-21)}
  if(u.sat){const tg=u.sat.tg,[x1,y1]=P(u.x,u.y),[x2,y2]=P(tg.x,tg.y),p=1-u.sat.t/4;g.strokeStyle='#FFD45C55';g.lineWidth=18*s;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    g.strokeStyle='#FFD45C';g.lineWidth=6*s;g.beginPath();g.moveTo(x1,y1);g.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p);g.stroke()}}
function drawFx(dt){for(const f of G.fx){f.t+=dt;const p=Math.min(1,f.t/f.d);
  if(f.k==='shot'){const [x1,y1]=P(f.x,f.y),[x2,y2]=P(f.x2,f.y2),hx=x1+(x2-x1)*p,hy=y1+(y2-y1)*p-(f.big?60:20)*Math.sin(p*Math.PI)*.3;g.strokeStyle=f.col;g.lineWidth=f.big?8:5;g.beginPath();g.moveTo(hx-(x2-x1)*.08,hy-(y2-y1)*.08);g.lineTo(hx,hy);g.stroke()}

  if(f.k==='fan'){const [x,y,s]=P(f.x,f.y);g.fillStyle=f.col+'44';g.strokeStyle=f.col;g.lineWidth=3;g.beginPath();g.moveTo(x,y);const a0=f.dir>0?-Math.PI/2:Math.PI/2;g.arc(x,y,6*PXM*s*Math.min(1,p*2),a0-.87,a0+.87);g.closePath();g.globalAlpha=1-p;g.fill();g.stroke();g.globalAlpha=1}

  if(G.phase==='play'){acc+=dt;while(acc>=1/30){step(1/30);acc-=1/30}}
  draw(G.phase==='play'?dt:real);hud();requestAnimationFrame(loop)}
function setPhase(t,col){const p=$('phase');p.textContent=t;p.style.color=col;p.style.display=t?'block':'none'}

// ---------- 结束 / 结算 ----------
function end(){if(G.over)return;G.over=true;G.phase='over';clearSel();
  let r=G.crowns.P>G.crowns.E?'胜':G.crowns.P<G.crowns.E?'负':'平',note='';
  if(r==='平'&&G.ot&&!G.quit){const low=s=>Math.min(...G.towers.filter(t=>t.side===s&&!t.dead).map(t=>t.hp/t.max));const a=low('P'),b=low('E');if(Math.abs(a-b)>.005){r=a>b?'胜':'负';note='双方击破数相同，按最低建筑血量比例判定'}}
  if(G.quit){r='负';note='中途退出判负'}
  const sec=Math.round(G.elapsed);const rec={r,score:`${G.crowns.P} : ${G.crowns.E}`,opp:oppPreset.name,me:deckName(ds.slot),t:`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`,ot:G.ot,real:1};
  try{const h=JSON.parse(localStorage.getItem('fd_lobby_hist')||'[]');h.unshift(rec);localStorage.setItem('fd_lobby_hist',JSON.stringify(h.slice(0,10)));
    localStorage.setItem('fd_lobby_reward',JSON.stringify({r,at:Date.now()}))}catch(e){}
  setTimeout(()=>result(r,note),700)}
function result(r,note){const R=$('res'),col={胜:'#FFD45C',负:'#E8413C',平:'#e9eef4'}[r],word={胜:'胜利',负:'失败',平:'平局'}[r];
  const row=(top,name,n,c,delay)=>`<div class="rrow" style="top:${top}px;animation-delay:${delay}ms"><div class="t lm" style="left:40px;top:75px;font-size:44px;color:#fff;font-weight:900">${name}</div><div class="rc">${[0,1,2].map(i=>`<div class="crown" data-lit="${i<n?1:0}"></div>`).join('')}</div></div>`;
  R.innerHTML=`<div class="rtitle" style="background-image:url(../handoff/battle-r01/UI_FDBattle_Result_${{胜:'Win',负:'Lose',平:'Draw'}[r]}.png)"><div class="rbig" style="color:${col};text-shadow:0 6px 0 #0a1320">${word}</div></div>`+
    row(1060,'AI 指挥官',G.crowns.E,'#FF5A4E',400)+`<div class="t mm" style="left:540px;top:1290px;font-size:84px;color:#fff;font-weight:900;font-style:italic">${G.crowns.P} : ${G.crowns.E}</div>`+row(1380,'我方',G.crowns.P,'#4AA3FF',500)+
    (note?`<div class="t mm" style="left:540px;top:1590px;font-size:28px;color:#c9d3dd;font-weight:500">${note}</div>`:'')+
    (r==='胜'?`<div class="t mm" id="rew" style="left:540px;top:1660px;font-size:40px;color:#DCA822;font-weight:900;opacity:0;transition:opacity .3s">战功 +30</div>`:'')+
    `<div class="btn skin b-yel" id="again" style="left:90px;top:1880px;width:420px;height:140px;font-size:44px;opacity:0;transition:opacity .25s">再来一局</div>`+
    `<div class="btn skin b-wht" id="home" style="left:570px;top:1880px;width:420px;height:140px;font-size:44px;opacity:0;transition:opacity .25s">返回大厅</div>`;
  R.classList.add('on');
  // 皇冠逐个点亮：对手先，我方后，每个 0.3 秒
  const lits=[...R.querySelectorAll('.rrow')].flatMap((row,ri)=>[...row.querySelectorAll('.crown')].filter(c=>c.dataset.lit==='1').map(c=>[c,ri?'#4AA3FF':'#FF5A4E']));
  lits.forEach(([c,co],i)=>setTimeout(()=>{c.classList.add(co==='#4AA3FF'?'b':'r','lit')},800+i*300));
  setTimeout(()=>{['again','home'].forEach(id=>$(id).style.opacity=1);if($('rew'))$('rew').style.opacity=1},900+lits.length*300);
  pressable($('again'),()=>location.replace(location.pathname+location.search.replace(/[?&]skip=1/,'')+(location.search?'&':'?')+'skip=1'));
  pressable($('home'),goHome)}
function goHome(){const from=Q.get('from');const url=from==='app'?'../../app/#battle-back':'../../lobby/prototype/';(window.top||window).location.href=url}
function pressable(el,fn){el.addEventListener('pointerdown',()=>el.classList.add('press'));el.addEventListener('pointerleave',()=>el.classList.remove('press'));
  el.addEventListener('pointerup',()=>{el.classList.remove('press');setTimeout(fn,90)})}
// 退出确认（B05）
pressable($('exitBtn'),()=>{if(G.phase!=='play')return;$('mask').classList.add('on');const p=$('pop');p.style.pointerEvents='auto';
  p.innerHTML=`<div class="mframe" style="left:140px;top:860px;width:800px;height:620px"></div><div class="t mm" style="left:540px;top:930px;font-size:44px;color:#17263A;font-weight:900">退出对局？</div>
   <div class="t mm" style="left:540px;top:1130px;font-size:36px;color:#fff;font-weight:700">退出会判负。</div>
   <div class="btn skin b-wht" id="cx" style="left:200px;top:1300px;width:320px;height:110px;font-size:38px">取消</div>
   <div class="btn skin b-wht" id="qx" style="left:560px;top:1300px;width:320px;height:110px;font-size:38px;color:#fff;background:#c9332e;border-radius:10px;border-image:none;border:6px solid #e9e5dc">退出</div>`;
  const close=()=>{$('mask').classList.remove('on');p.innerHTML='';p.style.pointerEvents='none'};
  pressable($('cx'),close);pressable($('qx'),()=>{close();G.quit=true;end()})});

// ---------- VS 入场 → 上下分开 → 开战 ----------
const vsp=(f,[x,y,w,h],ex='')=>`<div class="sp" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(${VSL}${f}.png);${ex}"></div>`;
const vtx=(t,x,y,size,color,it,anchor='mm',w=900)=>`<div class="t ${anchor}" style="left:${x}px;top:${y}px;font-size:${size}px;color:${color};font-weight:${w};${it?'font-style:italic;':''}">${t}</div>`;
function vsHtml(){let h=`<div class="g bg">`+vsp('Background',[0,0,1080,2340])+`</div>`;
  h+=`<div class="g up"><div class="g g-opp">`+vsp('OpponentPanel',[57,380,935,363])+vsp('OpponentBadge',[150,470,248,211])+vtx('对手',241,417,41,'#fff',1)+vtx('AI',272,578,95,'#F5EFE3',1)+vtx('AI 指挥官',676,549,74,'#16243A',1)+vtx(`对手卡组：${oppPreset.name} · AI ${ds.ai}`,631,630,37,'#16243A',0,'mm',700)+`</div></div>`;
  h+=`<div class="g dn"><div class="g g-me">`+vsp('PlayerPanel',[56,1253,972,301])+vsp('PlayerBadge',[212,1315,221,179])+vtx('指',318,1410,83,'#F5EFE3',0)+vtx('指挥官',662,1381,75,'#16243A',1)+vtx(`我方卡组：${deckName(ds.slot)}`,657,1461,38,'#16243A',0,'mm',700)+`</div>`;
  h+=`<div class="g g-deck">`+vsp('DeckPanel',[47,1572,985,293]);
  myCards.forEach((k,i)=>{const c=CARDS[k],x=88+i*115;h+=vsp('Art_'+c.art,[x+4,1656,97,106])+vsp('CardFrame',[x,1628,105,165])+vtx(c.cost,x+17,1641,21,'#fff',0,'mm',700)+vtx(c.name,x+53,1776,c.name.length>5?13:15,'#16243A',0,'mm',700)});
  h+=`</div><div class="g g-load">`+vtx(TIPS[Math.floor(Math.random()*TIPS.length)],540,1933,30,'#fff',1,'mm',700)+vtx('加载中…',103,2003,31,'#fff',1,'lm',700)+vsp('LoadingBed',[103,2040,892,35])+`<div id="vsFill" style="position:absolute;left:114px;top:2041px;width:778px;height:32px;clip-path:inset(0 100% 0 0)">`+vsp('LoadingFill',[0,0,778,32])+`</div>`+vsp('LoadingTrack',[71,2024,941,67])+`<div class="t mm" id="pct" style="left:941px;top:2058px;font-size:30px;color:#fff;font-weight:900;font-style:italic">0%</div></div></div>`;
  h+=`<div class="g mid"><div class="g g-v">`+vsp('V',[255,850,361,310])+`</div><div class="g g-s">`+vsp('S',[475,829,356,333])+`</div><div class="g g-flash">`+vsp('FX_Flash',[275,852,543,321],'mix-blend-mode:screen')+`</div></div>`;
  return h}
async function intro(){
  crowns('pCrowns',0,'#4AA3FF');crowns('eCrowns',0,'#FF5A4E');$('oppName').textContent='AI 指挥官';
  if(!SKIP){const V=$('vs');V.innerHTML=vsHtml();V.classList.add('on','anim');
    // 真实加载：战场贴图、卡面都准备好才走到 100%；入场至少 1.25 秒
    let p=0;const t0=performance.now();await new Promise(ok=>{const iv=setInterval(()=>{const el=performance.now()-t0;p=Math.min(el<1250||!assetsOk?.95:1,p+Math.random()*.04+.015);
      $('vsFill').style.clipPath=`inset(0 ${(1-p)*100}% 0 0)`;$('pct').textContent=Math.floor(p*100)+'%';if(p>=1){clearInterval(iv);ok()}},70)});
    await wait(350);V.classList.add('split');await wait(480);V.classList.remove('on','anim','split');V.innerHTML=''}
  buildHand(true);await wait(4*100+260);
  await countdown();G.phase='play';last=performance.now()}

// ---------- 启动 ----------
function fit(){const de=document.documentElement,W2=de.clientWidth||innerWidth,H2=de.clientHeight||innerHeight;const s=Math.min(W2/1080,H2/2340),w=$('wrap');w.style.transform=`scale(${s})`;w.style.left=((W2-1080*s)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
document.addEventListener('touchstart',()=>{},{passive:true});
let assetsOk=false;
const fontsReady=()=>Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,2500))]);
const CARD_IMGS=[SP2+'UI_FDDeck_CardFrame.png'].concat(Object.values(CARDS).map(c=>SP2+`UI_FDDeck_Art_${c.art}.png`));
const VS_IMGS=['Background','OpponentPanel','OpponentBadge','PlayerPanel','PlayerBadge','DeckPanel','V','S','FX_Flash','LoadingBed','LoadingFill','LoadingTrack','CardFrame'].map(n=>VSL+n+'.png').concat(myCards.map(k=>VSL+'Art_'+CARDS[k].art+'.png'));
const SKIN=['Button_White','Button_Yellow','Modal_Tactic'].map(n=>SP3+`UI_FDDeck_${n}.png`).concat(['TopBar','BottomPanel','TimerFrame','TimerFrame_Overtime','Crown_Empty','Crown_Blue','Crown_Red','EnergyBar','EnergyFill','EnergyGem','X2','Banner','Result_Win','Result_Lose','Result_Draw','HandCard_Shade'].map(n=>'../handoff/battle-r01/UI_FDBattle_'+n+'.png'));
(async()=>{
  await Promise.all((SKIP?[]:VS_IMGS).concat(SKIN).map(load).concat([fontsReady()]));
  $('canvas').classList.remove('boot');requestAnimationFrame(loop);
  Promise.all(CARD_IMGS.map(load)).then(()=>{assetsOk=true;Object.keys(CV).forEach(k=>delete CV[k])});
  if(SKIP)await Promise.all(CARD_IMGS.map(load)),assetsOk=true;
  intro();
})();
</script>
