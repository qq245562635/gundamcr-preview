<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>选卡组界面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
@font-face{font-family:Armor;src:url(../handoff/armor-r03/fonts/ArmorUIReviewR03.ttf);font-weight:100 900;font-display:block}
:root{--ink:#111E2B;--cyan:#2FD3E0;--gold:#FFD45C;--navy:#1e2a3a;--F:Armor,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a121d;overflow:hidden;font-family:var(--F)}
/* fixed：1080 宽的画布不撑大手机的布局视口（否则手机浏览器会缩小整页、fit 算错） */
#wrap{position:fixed;left:0;top:0;width:1080px;height:2340px;transform-origin:top left}
#canvas{position:relative;width:1080px;height:2340px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;background:#1d2a3b}
/* 底图、卡牌、字体都到齐后整屏一起显示，避免文字先出、底图后出 */
#canvas.boot>*{visibility:hidden}
#canvas.boot::after{content:"加载中…";position:absolute;left:0;right:0;top:1150px;text-align:center;color:#8c96a3;font:500 36px sans-serif}
#canvas.reveal>*{animation:sceneIn .22s ease-out}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
/* 底板层：r02 原生 830×1896，按 r02 转换系数铺到 1080×2340 */
.native{position:absolute;left:0;top:0;width:830px;height:1896px;transform:scale(1.3012048,1.2341772);transform-origin:0 0}
#stage{background:url(base_clean.png) 0 0/830px 1896px}
.t{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;line-height:1;pointer-events:none}
.hit{position:absolute;cursor:pointer}
.tabsel{position:absolute;width:186px;height:82px;background:url(tab_selected.png) 0 0/100% 100%;top:208px;transition:left .2s}
#filters{position:absolute;left:32px;top:1149px;width:766px;height:56px;background:var(--navy);overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 126px;height:50px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px;position:relative;cursor:pointer}
.chip+.chip::before{content:"";position:absolute;left:0;top:13px;height:26px;border-left:1.5px solid #c9d3dd}
.chip.on{background:url(filter_selected.png) 0 0/100% 100%}
.chip.on::before,.chip.on+.chip::before{display:none}
.chip i{display:inline-block;width:8px;height:22px;margin-right:8px;border-radius:2px}
.card{position:absolute;transition:left .25s cubic-bezier(.3,.7,.3,1),top .25s cubic-bezier(.3,.7,.3,1),width .25s,height .25s,opacity .2s,transform .12s;cursor:pointer;z-index:2;touch-action:none}
.card canvas{width:100%;height:100%;display:block;pointer-events:none}
.card.press{transform:scale(.95);filter:brightness(.9)}
.card.sel{transform:scale(1.12) translateY(-6px);z-index:6;filter:drop-shadow(0 14px 14px #000b)}
.card.sel::after,.card.cand::after{content:"";position:absolute;inset:-5px;border:4px solid var(--cyan);border-radius:10px;box-shadow:0 0 14px var(--cyan);pointer-events:none}
.card.cand{animation:wob .4s ease-in-out infinite alternate;z-index:5}
@keyframes wob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.card.cand::after{animation:breath 1s ease-in-out infinite alternate}
@keyframes breath{from{opacity:.45}to{opacity:1}}
.card.tgt{transform:scale(1.05)!important;animation:none}
.card.tgt::after{content:"";position:absolute;inset:-5px;border:4px solid var(--gold);border-radius:10px;box-shadow:0 0 14px var(--gold);pointer-events:none}
.card.hide{opacity:0;pointer-events:none}
.card.drag{transition:none;transform:scale(1.1);z-index:15;filter:drop-shadow(0 14px 18px #000c)}
.card.ghost{opacity:.35;pointer-events:none;transition:none}
/* 1080 坐标的弹层 */
.skin{border-style:solid;border-color:transparent}
.b-yel{border-image:url(../handoff/armor-r03/sprites/UI_FDDeck_Button_Yellow.png) 30 fill/30px stretch}
.b-wht{border-image:url(../handoff/armor-r03/sprites/UI_FDDeck_Button_White.png) 30 fill/30px stretch}
.b-blu{border-image:url(../handoff/armor-r03/sprites/UI_FDDeck_Button_Blue.png) 22 fill/22px stretch}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;color:var(--ink);font-family:var(--F)}
.btn.b-blu{color:#fff}
.btn:active{filter:brightness(.92);transform:scale(.97)}
#bubble{position:absolute;z-index:20;display:none;border-image:url(../handoff/armor-r03/sprites/UI_FDDeck_Bubble.png) 22 fill/22px stretch;border-style:solid;border-color:transparent}
#bubble::after{content:"";position:absolute;left:var(--ax,50%);margin-left:-13px;border:13px solid transparent}
#bubble.up::after{top:calc(100% + 4px);border-top-color:#e9e5dc}
#bubble.down::after{bottom:calc(100% + 4px);border-bottom-color:#e9e5dc}
#dim{position:absolute;left:0;top:1318px;width:1080px;height:1022px;background:#0009;z-index:18;display:none}
#float{position:absolute;z-index:19;display:none;left:360px;top:1302px;width:360px;height:516px;animation:pop .2s ease-out}
#float canvas{width:100%;height:100%;filter:drop-shadow(0 10px 18px #000c)}
#hint{position:absolute;z-index:19;display:none;left:540px;top:1880px;transform:translate(-50%,-50%);color:#fff;font-weight:700;font-size:36px;text-shadow:0 2px 6px #000}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mask{position:absolute;inset:0;background:#0009;z-index:40;display:none}
.mask.on{display:block}
.modal{position:absolute;background-size:100% 100%;animation:pop .2s ease-out}
.mframe{position:absolute;border-style:solid;border-color:transparent;border-width:160px 40px 200px 40px;border-image:url(../handoff/armor-r03/sprites/UI_FDDeck_Modal_Tactic.png) 160 40 200 40 fill stretch;animation:pop .2s ease-out}
.lbl{position:absolute;white-space:nowrap;line-height:1}
.ic{position:absolute;width:42px;height:42px}
#toast{position:absolute;left:50%;top:2000px;transform:translateX(-50%);background:#111e2bee;color:#fff;border:2px solid var(--cyan);padding:20px 36px;border-radius:8px;font-size:32px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
/* S05 */
#prep{display:none;z-index:30;background:url(../handoff/armor-r02/sprites/UI_FDDeck_NavyTexture.png) repeat #1d2a3b}
#prep.on{display:block}
.inset{position:absolute;border-image:url(../handoff/armor-r03/sprites/UI_FDDeck_Inset_Skill.png) 26 fill/26px stretch;border-style:solid;border-color:transparent}
.ptab{position:absolute;width:177px;height:63px;background:url(../handoff/armor-r02/sprites/UI_FDDeck_Tab.png) 0 0/100% 100%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:var(--ink);cursor:pointer}
.ptab.on{background-image:url(tab_selected.png);color:#fff;height:72px;margin-top:-5px}
.mini{position:absolute;width:166px;height:238px}
.mini canvas{width:100%;height:100%}
/* 嵌入大厅壳（?embed=1）：去掉返回键和底栏，底部交给壳的导航 */
.embedPatch{position:absolute;display:none;pointer-events:none}
body.embed .embedPatch{display:block}
body.embed .ne{display:none}
/* CR 式点卡：卡放大浮起，正下方竖排按钮 */
#cmenu{position:absolute;z-index:21;display:none}
#cmenu .btn{position:relative;margin-bottom:10px;animation:mIn .12s ease-out both}
#cmenu .btn+.btn{animation-delay:.03s}
@keyframes mIn{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
#note{position:fixed;left:16px;top:16px;width:260px;color:#9fb3cc;font:14px/1.6 system-ui,sans-serif;display:none}
#note b{color:#fff}
@media (min-width:1100px){#note{display:block}}
</style>
</head>

function collection(){

  const by=[(a,b)=>CARDS[a].cost-CARDS[b].cost||CARDS[a].name.localeCompare(CARDS[b].name,'zh'),
            (a,b)=>ROLE_ORDER.indexOf(CARDS[a].role)-ROLE_ORDER.indexOf(CARDS[b].role)||CARDS[a].cost-CARDS[b].cost,
            (a,b)=>CARDS[a].name.localeCompare(CARDS[b].name,'zh')][sortMode];

}
function layout(){

function startReplace(k){

function endReplaceUI(){$('dim').style.display='none';$('float').style.display='none';$('hint').style.display='none';deck().forEach(d=>cardEls[d].classList.remove('cand','tgt'))}
function cancelReplace(){if(!replacing)return;cardEls[replacing].style.visibility='';endReplaceUI();replacing=null}
function doSwap(out,from){
  const inn=replacing;endReplaceUI();

  const f=from||[360/XS,1302/YS,360/XS,516/YS];
  e.style.transition='none';Object.assign(e.style,{left:f[0]+'px',top:f[1]+'px',width:f[2]+'px',height:f[3]+'px',visibility:''});e.classList.remove('hide');e.offsetWidth;e.style.transition='';

let drag=null;
function toNative(ev){const r=$('stage').getBoundingClientRect();return[(ev.clientX-r.left)/r.width*830,(ev.clientY-r.top)/r.height*1896]}
function deckCardAt(p){return deck().find(k=>{const e=cardEls[k],x=parseFloat(e.style.left),y=parseFloat(e.style.top);return p[0]>=x&&p[0]<=x+187&&p[1]>=y&&p[1]<=y+268})}
function onDown(k,ev){
  ev.preventDefault();const e=cardEls[k];e.classList.add('press');
  drag={k,start:toNative(ev),moved:false,ox:0,oy:0};e.setPointerCapture(ev.pointerId);
}
function onMove(k,ev){
  if(!drag||drag.k!==k)return;const p=toNative(ev),e=cardEls[k];
  if(!drag.moved){
    if(Math.hypot(p[0]-drag.start[0],p[1]-drag.start[1])<14||inDeck(k)||replacing)return;
    drag.moved=true;clearSel();e.classList.remove('press');
    drag.rect=[parseFloat(e.style.left),parseFloat(e.style.top),parseFloat(e.style.width),parseFloat(e.style.height)];
    const g=document.createElement('div');g.className='card ghost';g.append(cardCanvas(k));Object.assign(g.style,{left:e.style.left,top:e.style.top,width:e.style.width,height:e.style.height});$('cards').append(g);drag.ghost=g;
    e.classList.add('drag');
  }
  const r=drag.rect;e.style.left=(r[0]+p[0]-drag.start[0])+'px';e.style.top=(r[1]+p[1]-drag.start[1])+'px';
  const t=deckCardAt(p);deck().forEach(d=>cardEls[d].classList.toggle('tgt',d===t));
}
function onUp(k,ev){
  if(!drag||drag.k!==k)return;const e=cardEls[k];e.classList.remove('press');
  if(!drag.moved){drag=null;tapCard(k);return}
  const p=toNative(ev),t=deckCardAt(p);drag.ghost.remove();e.classList.remove('drag');
  deck().forEach(d=>cardEls[d].classList.remove('tgt'));
  if(t){replacing=k;doSwap(t,[parseFloat(e.style.left),parseFloat(e.style.top),parseFloat(e.style.width),parseFloat(e.style.height)])}
  else{toast('拖到上面一张卡上松手即可互换');layout()}
  drag=null;
}
function setSlot(i){if(replacing)cancelReplace();clearSel();state.slot=i;layout();save()}

function setFilter(r,silent){filter=r;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.r===r));if(!silent){clearSel();layout()}}

function wrapLines(t,maxPx,size=28){_mc.font=`500 ${size}px Armor,"Noto Sans SC",sans-serif`;

    if(t>.4){const p=e((t-.4)/.6);g.fillStyle='#4AA3FF33';g.strokeStyle='#4AA3FF';g.lineWidth=3;g.beginPath();g.moveTo(180,400);g.arc(180,400,320*p,-Math.PI/2-.87,-Math.PI/2+.87);g.closePath();g.fill();g.stroke()}
    if(t>1){[[90,180],[150,150],[210,140],[270,170],[180,110]].forEach(([x,y])=>{g.strokeStyle='#c9f7ff';g.lineWidth=3;g.globalAlpha=1-e((t-1)/.5);g.beginPath();g.moveTo(180,390);g.lineTo(x,y);g.stroke();g.globalAlpha=1;txt('瘫痪',x,y-22,'#FFD45C',1-e((t-1.2)/1.5))})}return}
  if(c.skill==='TRANS-AM'){const tr=t>.6&&t<2.2,y=430-e(t/2.4)*260;if(tr)for(let i=1;i<4;i++)tok(180,y+i*24,22,'#ff6fb1','',.25);tok(180,y,22,tr?'#ff4f9a':t>=2.2?'#7d6b96':B,name);

  if(c.skill==='卫星炮'){tok(180,400,30,B,name);const p=e(t/2);g.strokeStyle='#FFD45C55';g.lineWidth=20;g.beginPath();g.moveTo(180,370);g.lineTo(180,80);g.stroke();g.strokeStyle='#FFD45C';g.lineWidth=6;g.beginPath();g.moveTo(180,370);g.lineTo(180,370-290*p);g.stroke();
    if(t>2){g.strokeStyle=`rgba(255,240,180,${1-e((t-2)/.6)})`;g.lineWidth=46;g.beginPath();g.moveTo(180,370);g.lineTo(180,60);g.stroke();txt('卫星炮',180,40,'#FFD45C',1-e((t-2.2)/1))}else txt('蓄力',230,250,'#FFD45C',1);return}
  if(c.skill==='盾牌防御'){tok(180,330,24,B,name);tok(180,140,18,R);const sh=Math.max(0,1-e(t/2.2));g.fillStyle='#0a1320';g.fillRect(130,280,100,10);g.fillStyle='#d9f0ff';g.fillRect(132,282,96*sh,6);
    for(let i=0;i<4;i++){const p=e((t-i*.5)/.4);if(p>0&&p<1){g.fillStyle='#ffb0a8';g.beginPath();g.arc(180,140+p*170,6,0,7);g.fill()}}if(t>2.2)txt('破盾',180,270,'#cfe9ff',1-e((t-2.3)/.8));return}
  // 远程：射程圈 + 连射
  const rng=(c.stats.find(s=>s[0]==='Range')||[0,0,'近战'])[2];const ranged=!/近战/.test(rng);
  tok(180,ranged?380:430-e(t/1.4)*230,22,B,name);tok(180,150,20,R);

  else if(t>1.4&&Math.floor(t*4)%2===0){g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.arc(180,170,24,-.6,1.2);g.stroke()}
}

// ---------- 嵌入大厅壳 ----------
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
if(EMBED){document.body.classList.add('embed');let sw=null;const k=()=>document.documentElement.clientWidth/1080;
  addEventListener('pointerdown',e=>{if(e.target.closest('.card,.chip,#filters,.hit,.btn,.mask.on,#prep.on,#cmenu')||replacing)return;sw={x:e.clientX,y:e.clientY,on:false}});

addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();

function warm(src){return new Promise(r=>{const i=new Image();i.onload=()=>(i.decode?i.decode():Promise.resolve()).catch(()=>{}).then(r);i.onerror=()=>r();i.src=src})}

})();
