  else if(n.kind==='glow'){const [x,y,w,h]=n.rect;ctx.strokeStyle=n.color;ctx.lineWidth=n.width;ctx.shadowColor=n.color;ctx.shadowBlur=n.blur;ctx.beginPath();ctx.roundRect(x-3,y-3,w+6,h+6,18);ctx.stroke()}
  else if(n.kind==='polygon'){ctx.fillStyle=n.fill;ctx.beginPath();n.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill()}
  else if(n.kind==='line'){ctx.strokeStyle=n.fill;ctx.lineWidth=n.width;ctx.beginPath();n.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
  ctx.restore();
 }
 document.getElementById('notes').textContent=s.meta.origin==='collection'?'从收藏打开：使用 / 信息或使用 / 关闭。':s.meta.origin==='deck'?'从出战卡打开：仅信息或关闭。':s.label;
 document.getElementById('status').textContent='已加载：'+s.label+' · 1080 × 2340';
}
